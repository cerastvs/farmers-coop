services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmers_coop
      POSTGRES_USER: farmers_coop
      POSTGRES_PASSWORD: farmers_coop
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmers_coop -d farmers_coop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
